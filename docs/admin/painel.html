<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Administrativo | SJE</title><link rel="stylesheet" href="admin.css"></head><body>
<header class="top"><div class="brand"><img src="../img/logo-SJE.png" alt="SJE"><span>Banco de Talentos</span></div><button id="logout" class="btn secondary">Sair</button></header>
<main class="wrap"><h1>Área Administrativa</h1><div class="tabs"><button class="tab active" data-tipo="PF">Pessoa Física <span id="nPF"></span></button><button class="tab" data-tipo="PJ">Pessoa Jurídica <span id="nPJ"></span></button></div>
<div class="stats"><div class="stat"><span>Cadastros nesta categoria</span><strong id="total">–</strong></div><div class="stat"><span>Com documento/currículo</span><strong id="comcv">–</strong></div><div class="stat"><span>Áreas diferentes</span><strong id="areas">–</strong></div></div>
<div class="toolbar"><input id="busca" placeholder="Buscar por nome/razão social, e-mail, município ou área"><select id="filtro"><option value="">Todas as áreas</option></select><button class="btn secondary" id="atualizar">Atualizar</button></div><div id="erro" class="msg"></div>
<div class="tablebox"><table><thead><tr><th>Nome / Razão social</th><th>E-mail</th><th>Município/UF</th><th>Área</th><th>Cadastro</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div></main><div class="footer">© 2026 Desenvolvido por Fernando Melo</div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitulo">Cadastro</h2><button class="btn secondary small" id="fechar">Fechar</button></div><div id="detalhes" class="grid"></div><div class="modalactions"><button class="btn" id="curriculo">Abrir documento</button><button class="btn secondary" id="editar">Editar cadastro</button><button class="btn danger" id="excluir">Excluir cadastro</button></div></div></div>
<div class="modal" id="modalEdit"><div class="modalbox"><div class="modalhead"><h2>Atualizar cadastro</h2><button class="btn secondary small" id="fecharEdit">Fechar</button></div><form id="formEdit"><div id="editCampos" class="grid"></div><div class="modalactions"><button type="submit" class="btn">Salvar alterações</button><button type="button" class="btn secondary" id="cancelEdit">Cancelar</button></div><div id="editMsg" class="msg"></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://sjyopwvsfzplrbgkfsiu.supabase.co','sb_publishable_cCElVvFsjiAqYUNllCRTkw_C8neo8y4');let dados=[],todos=[],selecionado=null,tipoAtual='PF';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function proteger(){const {data}=await sb.auth.getSession();if(!data.session){location.replace('login.html');return false}return true}
const area=x=>x.area_interesse||x.setor_atividade||''; const nome=x=>x.razao_social||x.nome_fantasia||'';
async function carregar(){if(!await proteger())return;const {data,error}=await sb.from('terceirizados').select('*').order('criado_em',{ascending:false});if(error){msgErro('Erro ao carregar cadastros: '+error.message);return}todos=data||[];document.getElementById('nPF').textContent=`(${todos.filter(x=>x.tipo==='PF').length})`;document.getElementById('nPJ').textContent=`(${todos.filter(x=>x.tipo==='PJ').length})`;aplicarTipo()}
function aplicarTipo(){dados=todos.filter(x=>x.tipo===tipoAtual);const areas=[...new Set(dados.map(area).filter(Boolean))].sort();document.getElementById('filtro').innerHTML='<option value="">Todas as áreas</option>'+areas.map(a=>`<option>${esc(a)}</option>`).join('');document.getElementById('total').textContent=dados.length;document.getElementById('comcv').textContent=dados.filter(x=>x.curriculo_path||x.documento_path).length;document.getElementById('areas').textContent=areas.length;render()}
function render(){const q=document.getElementById('busca').value.toLowerCase().trim(),f=document.getElementById('filtro').value;const arr=dados.filter(x=>(!f||area(x)===f)&&(!q||[nome(x),x.nome_fantasia,x.email,x.cidade,x.estado,area(x),x.cpf_cnpj].some(v=>String(v||'').toLowerCase().includes(q))));document.getElementById('tbody').innerHTML=arr.length?arr.map(x=>`<tr><td>${esc(nome(x))}</td><td>${esc(x.email)}</td><td>${esc(x.cidade||'–')}${x.estado?'/'+esc(x.estado):''}</td><td>${esc(area(x)||'–')}</td><td>${x.criado_em?new Date(x.criado_em).toLocaleDateString('pt-BR'):'–'}</td><td><div class="actions"><button class="btn small" onclick="ver('${x.id}')">Visualizar</button><button class="btn secondary small" onclick="editarId('${x.id}')">Editar</button><button class="btn danger small" onclick="excluirId('${x.id}')">Excluir</button></div></td></tr>`).join(''):'<tr><td colspan="6">Nenhum cadastro encontrado nesta categoria.</td></tr>'}
function camposVisual(x){return [['Tipo',x.tipo==='PF'?'Pessoa Física':'Pessoa Jurídica'],['Nome / Razão social',x.razao_social],['Nome fantasia',x.nome_fantasia],['CPF/CNPJ',x.cpf_cnpj],['E-mail',x.email],['Telefone',x.telefone],['Telefone secundário',x.telefone_secundario],['Município',x.cidade],['UF',x.estado],['CEP',x.cep],['Endereço',x.endereco],['Complemento',x.complemento],['Área de interesse',x.area_interesse||x.setor_atividade],['Escolaridade',x.escolaridade],['Faixa etária',x.faixa_etaria],['Experiências',x.experiencias],['Cursos / certificações',x.cursos],['Perfil profissional',x.perfil_profissional],['Observações',x.observacoes],['Consentimento',x.consentimento===true?'Sim':x.consentimento===false?'Não':'–'],['Data do consentimento',x.consentimento_em?new Date(x.consentimento_em).toLocaleString('pt-BR'):'–']].filter(c=>c[1]!==null&&c[1]!==undefined&&c[1]!=='')}
window.ver=id=>{selecionado=todos.find(x=>String(x.id)===String(id));if(!selecionado)return;document.getElementById('modalTitulo').textContent=selecionado.tipo==='PJ'?'Dados da Pessoa Jurídica':'Dados da Pessoa Física';document.getElementById('detalhes').innerHTML=camposVisual(selecionado).map(c=>`<div class="item"><b>${esc(c[0])}</b>${esc(c[1])}</div>`).join('');const path=selecionado.curriculo_path||selecionado.documento_path;document.getElementById('curriculo').style.display=path?'inline-block':'none';document.getElementById('modal').classList.add('open')};
const editaveis=[['razao_social','Nome / Razão social'],['nome_fantasia','Nome fantasia'],['cpf_cnpj','CPF/CNPJ'],['email','E-mail'],['telefone','Telefone'],['telefone_secundario','Telefone secundário'],['cidade','Município'],['estado','UF'],['cep','CEP'],['endereco','Endereço'],['complemento','Complemento'],['area_interesse','Área de interesse'],['setor_atividade','Setor / atividade'],['escolaridade','Escolaridade'],['faixa_etaria','Faixa etária'],['experiencias','Experiências'],['cursos','Cursos / certificações'],['perfil_profissional','Perfil profissional'],['observacoes','Observações']];
window.editarId=id=>{selecionado=todos.find(x=>String(x.id)===String(id));if(!selecionado)return;const disponiveis=editaveis.filter(([k])=>Object.prototype.hasOwnProperty.call(selecionado,k));document.getElementById('editCampos').innerHTML=disponiveis.map(([k,l])=>`<label class="field"><span>${esc(l)}</span>${['experiencias','cursos','perfil_profissional','observacoes'].includes(k)?`<textarea name="${k}">${esc(selecionado[k]||'')}</textarea>`:`<input name="${k}" value="${esc(selecionado[k]||'')}">`}</label>`).join('');document.getElementById('modal').classList.remove('open');document.getElementById('modalEdit').classList.add('open')};
window.excluirId=async id=>{const x=todos.find(v=>String(v.id)===String(id));if(!x)return;if(!confirm(`Tem certeza que deseja excluir o cadastro de ${nome(x)||'este registro'}? Esta ação não pode ser desfeita.`))return;const path=x.curriculo_path||x.documento_path;if(path){const {error:se}=await sb.storage.from('documentos').remove([path]);if(se&&!String(se.message).toLowerCase().includes('not found')){alert('Não foi possível excluir o documento: '+se.message);return}}const {error}=await sb.from('terceirizados').delete().eq('id',id);if(error){alert('Não foi possível excluir o cadastro: '+error.message);return}document.getElementById('modal').classList.remove('open');await carregar()};
document.getElementById('formEdit').onsubmit=async e=>{e.preventDefault();if(!selecionado)return;const fd=new FormData(e.currentTarget),upd={};for(const [k,v] of fd.entries())upd[k]=String(v).trim()||null;const {error}=await sb.from('terceirizados').update(upd).eq('id',selecionado.id);if(error){const m=document.getElementById('editMsg');m.className='msg err';m.textContent='Erro ao atualizar: '+error.message;return}document.getElementById('modalEdit').classList.remove('open');await carregar();alert('Cadastro atualizado com sucesso.')};
document.getElementById('curriculo').onclick=async()=>{if(!selecionado)return;const path=selecionado.curriculo_path||selecionado.documento_path;if(!path)return;const {data,error}=await sb.storage.from('documentos').createSignedUrl(path,60);if(error){alert('Não foi possível abrir o documento: '+error.message);return}window.open(data.signedUrl,'_blank','noopener')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tipoAtual=b.dataset.tipo;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('busca').value='';aplicarTipo()});
function msgErro(t){const m=document.getElementById('erro');m.className='msg err';m.textContent=t}function fecha(id){document.getElementById(id).classList.remove('open')}
document.getElementById('editar').onclick=()=>selecionado&&editarId(selecionado.id);document.getElementById('excluir').onclick=()=>selecionado&&excluirId(selecionado.id);document.getElementById('fechar').onclick=()=>fecha('modal');document.getElementById('fecharEdit').onclick=()=>fecha('modalEdit');document.getElementById('cancelEdit').onclick=()=>fecha('modalEdit');document.getElementById('busca').oninput=render;document.getElementById('filtro').onchange=render;document.getElementById('atualizar').onclick=carregar;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.replace('login.html')};carregar();
</script></body></html>
