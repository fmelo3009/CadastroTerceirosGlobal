<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Administrativo | SJE</title><link rel="stylesheet" href="admin.css"></head><body>
<header class="top"><div class="brand"><img src="../img/logo-SJE.png" alt="SJE"><span>Banco de Talentos</span></div><button id="logout" class="btn secondary">Sair</button></header><main class="wrap"><h1>Cadastros recebidos</h1><div class="stats"><div class="stat"><span>Total de candidatos</span><strong id="total">–</strong></div><div class="stat"><span>Com currículo</span><strong id="comcv">–</strong></div><div class="stat"><span>Áreas diferentes</span><strong id="areas">–</strong></div></div><div class="toolbar"><input id="busca" placeholder="Buscar por nome, e-mail, município ou área"><select id="filtro"><option value="">Todas as áreas</option></select><button class="btn secondary" id="atualizar">Atualizar</button></div><div id="erro" class="msg"></div><div class="tablebox"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Município/UF</th><th>Área</th><th>Cadastro</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div></main><div class="footer">© 2026 Desenvolvido por Fernando Melo</div>
<div class="modal" id="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;gap:10px"><h2 style="margin-top:0">Dados do candidato</h2><button class="btn secondary small" id="fechar">Fechar</button></div><div id="detalhes" class="grid"></div><div style="margin-top:18px"><button class="btn" id="curriculo">Abrir currículo</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://sjyopwvsfzplrbgkfsiu.supabase.co','sb_publishable_cCElVvFsjiAqYUNllCRTkw_C8neo8y4');let dados=[],selecionado=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function proteger(){const {data}=await sb.auth.getSession();if(!data.session){location.replace('login.html');return false}return true}
async function carregar(){if(!await proteger())return;const {data,error}=await sb.from('terceirizados').select('*').eq('tipo','PF').order('criado_em',{ascending:false});if(error){const m=document.getElementById('erro');m.className='msg err';m.textContent='Erro ao carregar candidatos: '+error.message;return}dados=data||[];const areas=[...new Set(dados.map(x=>x.area_interesse).filter(Boolean))].sort();document.getElementById('filtro').innerHTML='<option value="">Todas as áreas</option>'+areas.map(a=>`<option>${esc(a)}</option>`).join('');document.getElementById('total').textContent=dados.length;document.getElementById('comcv').textContent=dados.filter(x=>x.curriculo_path).length;document.getElementById('areas').textContent=areas.length;render()}
function render(){const q=document.getElementById('busca').value.toLowerCase().trim(),f=document.getElementById('filtro').value;const arr=dados.filter(x=>(!f||x.area_interesse===f)&&(!q||[x.razao_social,x.email,x.cidade,x.estado,x.area_interesse].some(v=>String(v||'').toLowerCase().includes(q))));document.getElementById('tbody').innerHTML=arr.length?arr.map(x=>`<tr><td>${esc(x.razao_social)}</td><td>${esc(x.email)}</td><td>${esc(x.cidade)}/${esc(x.estado)}</td><td>${esc(x.area_interesse)}</td><td>${x.criado_em?new Date(x.criado_em).toLocaleDateString('pt-BR'):'–'}</td><td><button class="btn small" onclick="ver('${x.id}')">Visualizar</button></td></tr>`).join(''):'<tr><td colspan="6">Nenhum candidato encontrado.</td></tr>'}
window.ver=id=>{selecionado=dados.find(x=>String(x.id)===String(id));if(!selecionado)return;const campos=[['Nome',selecionado.razao_social],['E-mail',selecionado.email],['Telefone',selecionado.telefone],['Telefone secundário',selecionado.telefone_secundario],['Município',selecionado.cidade],['UF',selecionado.estado],['Faixa etária',selecionado.faixa_etaria],['Área de interesse',selecionado.area_interesse],['Escolaridade',selecionado.escolaridade],['Experiências',selecionado.experiencias],['Cursos / certificações',selecionado.cursos],['Perfil profissional',selecionado.perfil_profissional],['Consentimento',selecionado.consentimento?'Sim':'Não'],['Data do consentimento',selecionado.consentimento_em?new Date(selecionado.consentimento_em).toLocaleString('pt-BR'):'–']];document.getElementById('detalhes').innerHTML=campos.map(c=>`<div class="item"><b>${esc(c[0])}</b>${esc(c[1]||'–')}</div>`).join('');document.getElementById('curriculo').style.display=selecionado.curriculo_path?'inline-block':'none';document.getElementById('modal').classList.add('open')};
document.getElementById('curriculo').onclick=async()=>{if(!selecionado?.curriculo_path)return;const {data,error}=await sb.storage.from('documentos').createSignedUrl(selecionado.curriculo_path,60);if(error){alert('Não foi possível abrir o currículo: '+error.message);return}window.open(data.signedUrl,'_blank','noopener')};
document.getElementById('fechar').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};document.getElementById('busca').oninput=render;document.getElementById('filtro').onchange=render;document.getElementById('atualizar').onclick=carregar;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.replace('login.html')};carregar();
</script></body></html>
