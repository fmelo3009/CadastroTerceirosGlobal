<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área Administrativa | SJE</title><link rel="stylesheet" href="admin.css"></head><body>
<header class="top"><div class="brand"><img src="../img/logo-SJE.png" alt="SJE"><span>Área Administrativa</span></div><a href="../index.html">Voltar ao portal</a></header>
<main class="wrap" style="max-width:500px"><div class="card"><h1 style="margin-top:0">Acesso administrativo</h1><p style="color:#667085">Entre com o usuário autorizado no Supabase.</p><form id="login"><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="senha">Senha</label><div class="password-wrap"><input id="senha" type="password" required autocomplete="current-password"><button class="eye" id="toggle" type="button" aria-label="Exibir senha" title="Exibir/ocultar senha">👁</button></div></div><button class="btn" style="width:100%" type="submit">Entrar</button><div id="msg" class="msg"></div></form></div></main><div class="footer">© 2026 Desenvolvido por Fernando Melo</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://sjyopwvsfzplrbgkfsiu.supabase.co','sb_publishable_cCElVvFsjiAqYUNllCRTkw_C8neo8y4');
(async()=>{const {data}=await sb.auth.getSession();if(data.session)location.href='painel.html'})();
const senha=document.getElementById('senha');document.getElementById('toggle').onclick=()=>{senha.type=senha.type==='password'?'text':'password'};
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.className='msg';const btn=e.submitter;btn.disabled=true;btn.textContent='Entrando...';const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:senha.value});btn.disabled=false;btn.textContent='Entrar';if(error){m.className='msg err';m.textContent='Não foi possível entrar. Confira e-mail e senha.';return}location.href='painel.html'};
</script></body></html>
