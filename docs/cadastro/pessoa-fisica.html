<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  'https://sjyopwvsfzplrbgkfsiu.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_cCElVvFsjiAqYUNllCRTkw_C8neo8y4';

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const formPF =
  document.getElementById('form-pf');

const mensagem =
  document.getElementById('mensagem-formulario');


formPF.addEventListener(
  'submit',
  async function (event) {

    event.preventDefault();

    const botao =
      formPF.querySelector(
        'button[type="submit"]'
      );

    const inputCurriculo =
      document.getElementById('curriculo');

    const arquivo =
      inputCurriculo.files[0];


    // =========================================================
    // 1. VALIDAR ARQUIVO
    // =========================================================

    if (!arquivo) {

      mensagem.innerHTML = `
        <div class="alert alert-error">
          Selecione um currículo.
        </div>
      `;

      return;
    }


    // máximo 10 MB
    if (arquivo.size > 10 * 1024 * 1024) {

      mensagem.innerHTML = `
        <div class="alert alert-error">
          O currículo deve ter no máximo 10 MB.
        </div>
      `;

      return;
    }


    const extensoesPermitidas =
      ['pdf', 'doc', 'docx'];

    const extensao =
      arquivo.name
        .split('.')
        .pop()
        .toLowerCase();


    if (
      !extensoesPermitidas.includes(extensao)
    ) {

      mensagem.innerHTML = `
        <div class="alert alert-error">
          Formato inválido.
          Envie PDF, DOC ou DOCX.
        </div>
      `;

      return;
    }


    botao.disabled = true;
    botao.textContent = 'Enviando...';

    mensagem.innerHTML = '';


    try {

      // =======================================================
      // 2. DADOS DO FORMULÁRIO
      // =======================================================

      const fd =
        new FormData(formPF);


      const municipioFinal =
        fd.get('municipio') === 'Outro'
          ? fd.get('municipio_outro')
          : fd.get('municipio');


      const profissaoFinal =
        fd.get('profissao') === 'Outros'
          ? fd.get('outra_profissao')
          : fd.get('profissao');


      if (!municipioFinal) {
        throw new Error(
          'Informe o município.'
        );
      }


      if (!profissaoFinal) {
        throw new Error(
          'Informe a profissão.'
        );
      }


      // =======================================================
      // 3. GERAR IDENTIFICADOR DO CADASTRO
      // =======================================================

      /*
       * Como o navegador não precisa receber o ID interno
       * da tabela terceirizados, usamos um UUID próprio
       * para organizar o currículo no Storage.
       */

      const identificador =
        crypto.randomUUID();


      const nomeArquivo =
        `curriculo-${Date.now()}.${extensao}`;


      const caminho =
        `terceirizados/${identificador}/${nomeArquivo}`;


      // =======================================================
      // 4. ENVIAR CURRÍCULO PARA O STORAGE
      // =======================================================

      const {
        error: erroUpload
      } = await sb.storage
        .from('documentos')
        .upload(
          caminho,
          arquivo,
          {
            contentType:
              arquivo.type ||
              'application/octet-stream',

            upsert: false
          }
        );


      if (erroUpload) {

        console.error(
          'Erro no upload:',
          erroUpload
        );

        throw new Error(
          'Não foi possível enviar o currículo: ' +
          erroUpload.message
        );
      }


      // =======================================================
      // 5. CADASTRAR PESSOA
      // =======================================================

      const {
        error: erroCadastro
      } = await sb
        .from('terceirizados')
        .insert({

          tipo: 'PF',

          razao_social:
            fd.get('nome'),

          cpf_cnpj:
            fd.get('cpf'),

          cidade:
            municipioFinal,

          telefone:
            fd.get('telefone'),

          telefone_secundario:
            fd.get('telefone_secundario') ||
            null,

          email:
            fd.get('email'),

          cep:
            fd.get('cep') ||
            null,

          endereco:
            fd.get('endereco') ||
            null,

          complemento:
            fd.get('complemento') ||
            null,

          setor_atividade:
            profissaoFinal,

          observacoes:
            fd.get('observacoes') ||
            null

        });


      if (erroCadastro) {

        console.error(
          'Erro cadastro:',
          erroCadastro
        );


        // remove currículo se cadastro falhar
        const {
          error: erroRemocao
        } = await sb.storage
          .from('documentos')
          .remove([caminho]);


        if (erroRemocao) {
          console.warn(
            'Não foi possível remover o arquivo após erro:',
            erroRemocao
          );
        }


        throw new Error(
          'Não foi possível salvar os dados: ' +
          erroCadastro.message
        );
      }


      // =======================================================
      // 6. SUCESSO
      // =======================================================

      mensagem.innerHTML = `

        <div
          style="
            padding:22px;
            border-radius:10px;
            background:#ecfdf3;
            border:1px solid #86efac;
            margin-bottom:25px;
          "
        >

          <strong
            style="
              display:block;
              font-size:18px;
              margin-bottom:5px;
            "
          >
            Cadastro realizado com sucesso!
          </strong>

          <span>
            Seus dados e currículo foram enviados.
          </span>

        </div>

      `;


      // =======================================================
      // 7. LIMPAR FORMULÁRIO
      // =======================================================

      formPF.reset();


      if (
        typeof arquivoSelecionado !==
        'undefined'
      ) {

        arquivoSelecionado.style.display =
          'none';
      }


      if (
        typeof nomeArquivo !==
        'undefined'
      ) {

        /*
         * não fazemos nada aqui porque
         * nomeArquivo também é usado como
         * variável do arquivo enviado
         */
      }


      if (
        typeof atualizarMunicipio ===
        'function'
      ) {

        atualizarMunicipio();
      }


      if (
        typeof atualizarProfissao ===
        'function'
      ) {

        atualizarProfissao();
      }


      // =======================================================
      // 8. LEVAR USUÁRIO PARA MENSAGEM
      // =======================================================

      mensagem.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });


    } catch (erro) {

      console.error(
        'ERRO NO CADASTRO:',
        erro
      );


      mensagem.innerHTML = `

        <div class="alert alert-error">

          <strong>
            Não foi possível concluir o cadastro.
          </strong>

          <br>

          ${
            erro.message ||
            'Tente novamente.'
          }

        </div>

      `;


      mensagem.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });


    } finally {

      botao.disabled = false;

      botao.textContent =
        'Enviar cadastro';

    }

  }
);
</script>
